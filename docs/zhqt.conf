# ============================================================
# 智企通 SmartEnterprise - Nginx 生产配置 v3.2
# 增加: SmartAuto /smartauto/ 路由, 系统开发模块 /system-dev/
# ============================================================

# ── HTTP → HTTPS 跳转 ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── 主域名 HTTPS: lg-auto.com ──────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lg-auto.com www.lg-auto.com;

    ssl_certificate /etc/letsencrypt/live/lg-auto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lg-auto.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lugong;
    index index.html;

    # 官网静态资源
    location /css/    { alias /var/www/lugong/css/;    expires 30d; add_header Cache-Control "public"; }
    location /images/ { alias /var/www/lugong/images/; expires 30d; add_header Cache-Control "public"; }
    location /js/     { alias /var/www/lugong/js/;     expires 30d; add_header Cache-Control "public"; }

    # ── SmartAuto 前端 /smartauto/ ───────────────
    location = /smartauto { return 301 /smartauto/; }
    location /smartauto/ {
        alias /var/www/smartauto/docs/;
        try_files $uri $uri/ /smartauto/index.html;
        add_header Cache-Control "no-cache, no-store";
    }

    # ── 系统健康端点 ────────────────────────────────
    location = /health { proxy_pass http://127.0.0.1:8000/health; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /ping   { proxy_pass http://127.0.0.1:8000/ping;  proxy_http_version 1.1; proxy_set_header Host $host; }

    # ── 智企通前端 /zhqt/ (SPA) ──────────────────
    location = /zhqt { return 301 /zhqt/; }
    location /zhqt/ {
        alias /var/www/zhqt/;
        try_files $uri $uri/ /zhqt/index.html;
        add_header Cache-Control "no-cache, no-store";
    }
    location /zhqt/assets/ {
        alias /var/www/zhqt/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API 代理 → FastAPI port 8000 ───────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Swagger / OpenAPI ───────────────────────
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LG-FileMS ───────────────────────────────
    location /lg-filems/ {
        alias /var/www/lg-filems/;
        try_files $uri $uri/ /lg-filems/index.html;
    }

    # ── 系统开发模块 /system-dev/ ────────────────
    location = /system-dev { return 301 /system-dev/; }
    location /system-dev/ {
        alias /var/www/lugong/system-dev/;
        try_files $uri $uri/ /system-dev/index.html;
        add_header Cache-Control "no-cache, no-store";
    }

    # ── Webhook ─────────────────────────────────
    location /webhook/ {
        proxy_pass http://127.0.0.1:6000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

