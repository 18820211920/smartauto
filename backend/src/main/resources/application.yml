spring:
  application:
    name: smartauto
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smartauto?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
  mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.smartauto.entity
    configuration:
      map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:smartauto-jwt-secret-key-2024}
  expiration: 86400000